[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opentoolbook"
version = "0.3.0"
description = "ToolBook 8 reader: open a book, draw a page, and run part of its OpenScript"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["opentoolbook*"]
