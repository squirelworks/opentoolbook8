name: merge cursor branches

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests
      - name: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready ${{ github.event.pull_request.number }} --repo ${{ github.repository }} || true
          gh pr merge ${{ github.event.pull_request.number }} --merge --repo ${{ github.repository }}
